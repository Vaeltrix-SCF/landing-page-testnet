name: Validate landing page
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - name: Production smoke tests
        run: |
          npm start -- --port 3001 > /tmp/vaeltrix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/ > /dev/null; then
              npm test
              exit $?
            fi
            sleep 1
          done
          cat /tmp/vaeltrix-server.log
          exit 1
